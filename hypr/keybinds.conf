# Applications and safe shell recovery.
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, B, exec, $browser
bind = SUPER, E, exec, $fileManager
bind = SUPER CTRL, R, exec, $projectPath/scripts/reload-shell.sh
bind = SUPER ALT, E, exec, quickshell --path $projectPath ipc call editor toggle
bind = SUPER ALT, D, exec, quickshell --path $projectPath ipc call desktop cycleMode
bind = SUPER ALT, P, exec, quickshell --path $projectPath ipc call mode cycle
bind = SUPER, P, exec, quickshell --path $projectPath ipc call profile toggle
# F1, not ?: on a German layout ? is Shift+ss and unreliable as a binding.
bind = SUPER, F1, exec, quickshell --path $projectPath ipc call shortcuts toggleSheet
bind = SUPER, D, exec, quickshell --path $projectPath ipc call launcher toggle
bind = SUPER, O, exec, quickshell --path $projectPath ipc call controlCenter toggle
bind = SUPER, I, exec, quickshell --path $projectPath ipc call settings toggle
bind = SUPER, N, exec, quickshell --path $projectPath ipc call notifications toggle
bind = SUPER, K, exec, quickshell --path $projectPath ipc call dashboard toggle
bind = SUPER, M, exec, quickshell --path $projectPath ipc call powerMenu toggle
bind = SUPER, L, exec, $projectPath/scripts/session-action.sh lock

# Window actions.
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
# Floating on and off. There was no binding for this at all until somebody
# asked how to do it: `hyprctl binds` found none, while the shortcut sheet has
# known the title "Toggle floating" since it was written - it simply never had
# a key to show beside it.
bind = SUPER, C, togglefloating

# SUPER + arrows are intentionally reserved for repeated resize. In tiled
# dwindle layouts resizeactive moves the split; floating windows resize too.
binde = SUPER, RIGHT, resizeactive, 30 0
binde = SUPER, LEFT, resizeactive, -30 0
binde = SUPER, DOWN, resizeactive, 0 30
binde = SUPER, UP, resizeactive, 0 -30

# Conflict-free focus navigation.
bind = SUPER ALT, LEFT, movefocus, l
bind = SUPER ALT, RIGHT, movefocus, r
bind = SUPER ALT, UP, movefocus, u
bind = SUPER ALT, DOWN, movefocus, d

# Workspaces 1-9, through the shell: with workspaces per monitor, `Super+3`
# means "the third workspace of the monitor under the focus", and only the
# shell knows which monitor that is. The `||` tail is the old, global
# behaviour, for a session whose shell is not running.
# movetoworkspacesilent keeps the user on the current workspace.
bind = SUPER, 1, exec, quickshell --path $projectPath ipc call workspaces switchTo 1 || hyprctl dispatch workspace 1
bind = SUPER, 2, exec, quickshell --path $projectPath ipc call workspaces switchTo 2 || hyprctl dispatch workspace 2
bind = SUPER, 3, exec, quickshell --path $projectPath ipc call workspaces switchTo 3 || hyprctl dispatch workspace 3
bind = SUPER, 4, exec, quickshell --path $projectPath ipc call workspaces switchTo 4 || hyprctl dispatch workspace 4
bind = SUPER, 5, exec, quickshell --path $projectPath ipc call workspaces switchTo 5 || hyprctl dispatch workspace 5
bind = SUPER, 6, exec, quickshell --path $projectPath ipc call workspaces switchTo 6 || hyprctl dispatch workspace 6
bind = SUPER, 7, exec, quickshell --path $projectPath ipc call workspaces switchTo 7 || hyprctl dispatch workspace 7
bind = SUPER, 8, exec, quickshell --path $projectPath ipc call workspaces switchTo 8 || hyprctl dispatch workspace 8
bind = SUPER, 9, exec, quickshell --path $projectPath ipc call workspaces switchTo 9 || hyprctl dispatch workspace 9
bind = SUPER SHIFT, 1, exec, quickshell --path $projectPath ipc call workspaces move 1 || hyprctl dispatch movetoworkspacesilent 1
bind = SUPER SHIFT, 2, exec, quickshell --path $projectPath ipc call workspaces move 2 || hyprctl dispatch movetoworkspacesilent 2
bind = SUPER SHIFT, 3, exec, quickshell --path $projectPath ipc call workspaces move 3 || hyprctl dispatch movetoworkspacesilent 3
bind = SUPER SHIFT, 4, exec, quickshell --path $projectPath ipc call workspaces move 4 || hyprctl dispatch movetoworkspacesilent 4
bind = SUPER SHIFT, 5, exec, quickshell --path $projectPath ipc call workspaces move 5 || hyprctl dispatch movetoworkspacesilent 5
bind = SUPER SHIFT, 6, exec, quickshell --path $projectPath ipc call workspaces move 6 || hyprctl dispatch movetoworkspacesilent 6
bind = SUPER SHIFT, 7, exec, quickshell --path $projectPath ipc call workspaces move 7 || hyprctl dispatch movetoworkspacesilent 7
bind = SUPER SHIFT, 8, exec, quickshell --path $projectPath ipc call workspaces move 8 || hyprctl dispatch movetoworkspacesilent 8
bind = SUPER SHIFT, 9, exec, quickshell --path $projectPath ipc call workspaces move 9 || hyprctl dispatch movetoworkspacesilent 9

# Pointer resizing remains available.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Hardware keys talk to the system backends directly; the shell follows the
# resulting PipeWire, backlight and MPRIS events. `e` repeats while held and
# `l` also works on the lock screen.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = SUPER, W, exec, quickshell --path $projectPath ipc call overview toggle
bind = SUPER SHIFT, W, exec, quickshell --path $projectPath ipc call wallpaperPicker toggle
bind = SUPER SHIFT, C, exec, quickshell --path $projectPath ipc call colorPicker pick
# Alt+Tab switcher: releasing Alt focuses the selection (transparent, so apps
# still see the release; a confirm without an open switcher does nothing).
bind = ALT, TAB, exec, quickshell --path $projectPath ipc call switcher next
bind = ALT SHIFT, TAB, exec, quickshell --path $projectPath ipc call switcher previous
bindrt = ALT, ALT_L, exec, quickshell --path $projectPath ipc call switcher confirm
bind = SUPER, V, exec, quickshell --path $projectPath ipc call clipboard toggle
bind = SUPER, PERIOD, exec, quickshell --path $projectPath ipc call emoji toggle
bind = SUPER, S, exec, $projectPath/scripts/screenshot.sh region
bind = SUPER SHIFT, S, exec, $projectPath/scripts/screenshot.sh screen
bind = SUPER ALT, S, exec, $projectPath/scripts/screenshot.sh window
bind = , Print, exec, $projectPath/scripts/screenshot.sh region
bind = SUPER SHIFT, R, exec, quickshell --path $projectPath ipc call recording toggle region
bind = SUPER CTRL SHIFT, R, exec, quickshell --path $projectPath ipc call recording toggle screen
bindl = , switch:on:Lid Switch, exec, quickshell --path $projectPath ipc call power lidClosed
bindl = , switch:off:Lid Switch, exec, quickshell --path $projectPath ipc call power lidOpened
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# The shell re-reads the backlight afterwards so the OSD shows the change.
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && quickshell --path $projectPath ipc call brightness refresh
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && quickshell --path $projectPath ipc call brightness refresh
# The keyboard light goes through the shell rather than running brightnessctl
# here: the LED's name carries its driver's prefix (tpacpi on this ThinkPad,
# asus or dell elsewhere) and a key binding cannot know it. The shell finds the
# device, steps the light and shows the OSD.
bindel = , XF86KbdBrightnessUp, exec, quickshell --path $projectPath ipc call kbdBacklight up
bindel = , XF86KbdBrightnessDown, exec, quickshell --path $projectPath ipc call kbdBacklight down
bindl = , XF86KbdLightOnOff, exec, quickshell --path $projectPath ipc call kbdBacklight toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
