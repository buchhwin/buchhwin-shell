# Applications and safe shell recovery.
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, B, exec, $browser
bind = SUPER, E, exec, $fileManager
bind = SUPER CTRL, R, exec, $projectPath/scripts/reload-shell.sh
bind = SUPER ALT, E, exec, quickshell --path $projectPath ipc call editor toggle
bind = SUPER ALT, D, exec, quickshell --path $projectPath ipc call desktop cycleMode
bind = SUPER ALT, P, exec, quickshell --path $projectPath ipc call mode cycle
# The work apps (Settings > Apps), started together.
bind = SUPER ALT, W, exec, quickshell --path $projectPath ipc call sessionApps startWork
bind = SUPER, P, exec, quickshell --path $projectPath ipc call profile toggle
# The display switcher, and the projector key (the next choice while it is open).
bind = SUPER SHIFT, P, exec, quickshell --path $projectPath ipc call displays toggleSwitcher
bindu = , XF86Display, exec, quickshell --path $projectPath ipc call displays key
# F1, not ?: on a German layout ? is Shift+ss and unreliable as a binding.
bind = SUPER, F1, exec, quickshell --path $projectPath ipc call shortcuts toggleSheet
bind = SUPER, D, exec, quickshell --path $projectPath ipc call launcher toggle
bind = SUPER, O, exec, quickshell --path $projectPath ipc call controlCenter toggle
bind = SUPER, I, exec, quickshell --path $projectPath ipc call settings toggle
bind = SUPER, N, exec, quickshell --path $projectPath ipc call notifications toggle
bind = SUPER, K, exec, quickshell --path $projectPath ipc call dashboard toggle
bind = SUPER, M, exec, quickshell --path $projectPath ipc call powerMenu toggle
bind = SUPER, L, exec, $projectPath/scripts/session-action.sh lock

# Window actions.
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
# Floating on and off. There was no binding for this at all until somebody
# asked how to do it: `hyprctl binds` found none, while the shortcut sheet has
# known the title "Toggle floating" since it was written - it simply never had
# a key to show beside it.
bind = SUPER, C, togglefloating
# Minimize (services/MinimizeService.qml): the window to a special workspace of
# its own, listed on the dock, in the overview and in Alt+Tab. Without a shell,
# Shift brings every minimized window back (scripts/restore-minimized.sh);
# Super+H minimizes nothing then - a window minimized without the shell would
# be listed nowhere.
bind = SUPER, H, exec, quickshell --path $projectPath ipc call window minimize
bind = SUPER SHIFT, H, exec, quickshell --path $projectPath ipc call window restore || $projectPath/scripts/restore-minimized.sh

# SUPER + arrows are intentionally reserved for repeated resize. In tiled
# dwindle layouts resizeactive moves the split; floating windows resize too.
binde = SUPER, RIGHT, resizeactive, 30 0
binde = SUPER, LEFT, resizeactive, -30 0
binde = SUPER, DOWN, resizeactive, 0 30
binde = SUPER, UP, resizeactive, 0 -30

# Conflict-free focus navigation.
bind = SUPER ALT, LEFT, movefocus, l
bind = SUPER ALT, RIGHT, movefocus, r
bind = SUPER ALT, UP, movefocus, u
bind = SUPER ALT, DOWN, movefocus, d

# Arranging the windows of a workspace: the focused one moves the way the
# arrow points, taking its neighbour's place (dwindle puts it into that slot);
# at the screen's edge it goes on to the next monitor, as the focus does.
bind = SUPER CTRL, LEFT, movewindow, l
bind = SUPER CTRL, RIGHT, movewindow, r
bind = SUPER CTRL, UP, movewindow, u
bind = SUPER CTRL, DOWN, movewindow, d

# Workspaces 1-9, through the shell: with workspaces per monitor, `Super+3`
# means "the third workspace of the monitor under the focus", and only the
# shell knows which monitor that is. The `||` tail is the old, global
# behaviour, for a session whose shell is not running.
# movetoworkspacesilent keeps the user on the current workspace.
# bindp: these keys reach Hyprland even while a window holds the keyboard
# (a VM console asks to inhibit shortcuts; Super+1 went to the guest).
bindp = SUPER, 1, exec, quickshell --path $projectPath ipc call workspaces switchTo 1 || hyprctl dispatch workspace 1
bindp = SUPER, 2, exec, quickshell --path $projectPath ipc call workspaces switchTo 2 || hyprctl dispatch workspace 2
bindp = SUPER, 3, exec, quickshell --path $projectPath ipc call workspaces switchTo 3 || hyprctl dispatch workspace 3
bindp = SUPER, 4, exec, quickshell --path $projectPath ipc call workspaces switchTo 4 || hyprctl dispatch workspace 4
bindp = SUPER, 5, exec, quickshell --path $projectPath ipc call workspaces switchTo 5 || hyprctl dispatch workspace 5
bindp = SUPER, 6, exec, quickshell --path $projectPath ipc call workspaces switchTo 6 || hyprctl dispatch workspace 6
bindp = SUPER, 7, exec, quickshell --path $projectPath ipc call workspaces switchTo 7 || hyprctl dispatch workspace 7
bindp = SUPER, 8, exec, quickshell --path $projectPath ipc call workspaces switchTo 8 || hyprctl dispatch workspace 8
bindp = SUPER, 9, exec, quickshell --path $projectPath ipc call workspaces switchTo 9 || hyprctl dispatch workspace 9
bindp = SUPER SHIFT, 1, exec, quickshell --path $projectPath ipc call workspaces move 1 || hyprctl dispatch movetoworkspacesilent 1
bindp = SUPER SHIFT, 2, exec, quickshell --path $projectPath ipc call workspaces move 2 || hyprctl dispatch movetoworkspacesilent 2
bindp = SUPER SHIFT, 3, exec, quickshell --path $projectPath ipc call workspaces move 3 || hyprctl dispatch movetoworkspacesilent 3
bindp = SUPER SHIFT, 4, exec, quickshell --path $projectPath ipc call workspaces move 4 || hyprctl dispatch movetoworkspacesilent 4
bindp = SUPER SHIFT, 5, exec, quickshell --path $projectPath ipc call workspaces move 5 || hyprctl dispatch movetoworkspacesilent 5
bindp = SUPER SHIFT, 6, exec, quickshell --path $projectPath ipc call workspaces move 6 || hyprctl dispatch movetoworkspacesilent 6
bindp = SUPER SHIFT, 7, exec, quickshell --path $projectPath ipc call workspaces move 7 || hyprctl dispatch movetoworkspacesilent 7
bindp = SUPER SHIFT, 8, exec, quickshell --path $projectPath ipc call workspaces move 8 || hyprctl dispatch movetoworkspacesilent 8
bindp = SUPER SHIFT, 9, exec, quickshell --path $projectPath ipc call workspaces move 9 || hyprctl dispatch movetoworkspacesilent 9

# The neighbouring workspace of the monitor under the focus: the next or
# previous pip of its row, one new one past the last (WorkspaceLogic.step),
# by key and by Super and the wheel - Windows' Win+Ctrl+arrows, GNOME's
# Super+Page Up/Down. With Shift the window goes along. Through the shell like
# the numbers, so the per-monitor blocks and the held workspaces count; the
# `||` tail is Hyprland's own `m+1`, the monitor's existing workspaces. One
# wheel step per binds:scroll_event_delay (300 ms), so a touchpad swipe is a
# step too, not ten.
bind = SUPER, Next, exec, quickshell --path $projectPath ipc call workspaces next || hyprctl dispatch workspace m+1
bind = SUPER, Prior, exec, quickshell --path $projectPath ipc call workspaces previous || hyprctl dispatch workspace m-1
bind = SUPER SHIFT, Next, exec, quickshell --path $projectPath ipc call workspaces moveNext || hyprctl dispatch movetoworkspace m+1
bind = SUPER SHIFT, Prior, exec, quickshell --path $projectPath ipc call workspaces movePrevious || hyprctl dispatch movetoworkspace m-1
bind = SUPER, mouse_down, exec, quickshell --path $projectPath ipc call workspaces scroll down || hyprctl dispatch workspace m+1
bind = SUPER, mouse_up, exec, quickshell --path $projectPath ipc call workspaces scroll up || hyprctl dispatch workspace m-1

# A window kept on top: floated if it is tiled, then pinned - on every
# workspace of its monitor, above the rest (PowerToys' Win+Ctrl+T). Again to
# let it go; one the shell floated for this goes back into the layout.
bind = SUPER CTRL, T, exec, quickshell --path $projectPath ipc call window keepOnTop

# The drop-down terminal: one Alacritty window on a special workspace of its
# own, shown over whatever is on screen and put away again (Yakuake). The key
# left of 1 by its place - ^ on a German keyboard, ` on a US one; the first
# press starts the window. The tail shows or hides it without a shell.
bind = SUPER, code:49, exec, quickshell --path $projectPath ipc call dropdown toggle || hyprctl dispatch togglespecialworkspace buchhwin-dropdown

# Screen zoom around the pointer, Hyprland's cursor:zoom_factor, in the
# shell's steps with the OSD: Super and + / - / 0, beside each other on the
# German layout.
bind = SUPER, plus, exec, quickshell --path $projectPath ipc call zoom increase
bind = SUPER, minus, exec, quickshell --path $projectPath ipc call zoom decrease
bind = SUPER, 0, exec, quickshell --path $projectPath ipc call zoom reset
# The color filter chosen in Settings > Appearance, on and off (Windows'
# Win+Ctrl+C).
bind = SUPER CTRL, C, exec, quickshell --path $projectPath ipc call colorFilter toggle

# Keyboard passthrough: every key goes to the focused window - Alt+Tab, the
# Windows key and Super+L reach a Citrix session or a virtual machine instead
# of this session - until Super+Esc again. The submap holds nothing but that
# way out, bound here in the compositor so it never waits for the shell; the
# hardware keys below are bound for every submap (`u`) and keep working. The
# shell shows a chip while it lasts and gives the keys back when the focus
# goes to another window (services/hypr/PassthroughLogic.js).
bind = SUPER, Escape, submap, passthrough
submap = passthrough
bind = SUPER, Escape, submap, reset
submap = reset

# Pointer resizing remains available.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Hardware keys talk to the system backends directly; the shell follows the
# resulting PipeWire, backlight and MPRIS events. `e` repeats while held,
# `l` also works on the lock screen and `u` in every submap - the keyboard
# passthrough above takes every other key, not these.
bindelu = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindelu = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = SUPER, W, exec, quickshell --path $projectPath ipc call overview toggle
bind = SUPER SHIFT, W, exec, quickshell --path $projectPath ipc call wallpaperPicker toggle
bind = SUPER SHIFT, D, exec, quickshell --path $projectPath ipc call dock toggle
# The start menu, only while the dock has a start button (the taskbar).
bind = SUPER, SPACE, exec, quickshell --path $projectPath ipc call startMenu key
bind = SUPER SHIFT, C, exec, quickshell --path $projectPath ipc call colorPicker pick
# Alt+Tab switcher: releasing Alt focuses the selection (transparent, so apps
# still see the release; a confirm without an open switcher does nothing).
bind = ALT, TAB, exec, quickshell --path $projectPath ipc call switcher next
bind = ALT SHIFT, TAB, exec, quickshell --path $projectPath ipc call switcher previous
bindrt = ALT, ALT_L, exec, quickshell --path $projectPath ipc call switcher confirm
bind = SUPER, V, exec, quickshell --path $projectPath ipc call clipboard toggle
bind = SUPER, PERIOD, exec, quickshell --path $projectPath ipc call emoji toggle
bind = SUPER, S, exec, $projectPath/scripts/screenshot.sh region
bind = SUPER SHIFT, S, exec, $projectPath/scripts/screenshot.sh screen
bind = SUPER ALT, S, exec, $projectPath/scripts/screenshot.sh window
# Text from a region of the screen (tesseract), on the clipboard.
bind = SUPER ALT, T, exec, $projectPath/scripts/screenshot.sh text
bind = , Print, exec, $projectPath/scripts/screenshot.sh region
bind = SUPER SHIFT, R, exec, quickshell --path $projectPath ipc call recording toggle region
bind = SUPER CTRL SHIFT, R, exec, quickshell --path $projectPath ipc call recording toggle screen
# Without a shell (gave up, still starting) `quickshell ipc` exits 255 and the
# lid still locks the screen.
bindlu = , switch:on:Lid Switch, exec, quickshell --path $projectPath ipc call power lidClosed || $projectPath/scripts/session-action.sh lock
bindlu = , switch:off:Lid Switch, exec, quickshell --path $projectPath ipc call power lidOpened
bindlu = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# The microphone key mutes every microphone through the shell (an app may
# have opened one that is not the default); without a shell, wpctl toggles
# the default one as before.
bindlu = , XF86AudioMicMute, exec, quickshell --path $projectPath ipc call audio micMute || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Push to talk: the microphone is on while Super+T is held. A global
# shortcut, so the shell hears the key's release even when Super is let go
# first (an exec release bind would not fire then).
bind = SUPER, T, global, buchhwin:audio.talk
# Caps Lock's message (Settings > Desktop, off by default): on the release,
# whatever the modifiers, and the key stays the window's.
bindrni = , Caps_Lock, global, buchhwin:osd.capsLock
# The shell steps the backlight (the same brightnessctl call) and re-reads it
# so the OSD shows the change. The `||` tail is for a session whose shell is
# not running, like the workspace keys'.
bindelu = , XF86MonBrightnessUp, exec, quickshell --path $projectPath ipc call brightness up || brightnessctl -e4 -n2 set 5%+
bindelu = , XF86MonBrightnessDown, exec, quickshell --path $projectPath ipc call brightness down || brightnessctl -e4 -n2 set 5%-
# The keyboard light goes through the shell rather than running brightnessctl
# here: the LED's name carries its driver's prefix (tpacpi on ThinkPads,
# asus or dell elsewhere) and a key binding cannot know it. The shell finds the
# device, steps the light and shows the OSD.
bindelu = , XF86KbdBrightnessUp, exec, quickshell --path $projectPath ipc call kbdBacklight up
bindelu = , XF86KbdBrightnessDown, exec, quickshell --path $projectPath ipc call kbdBacklight down
bindlu = , XF86KbdLightOnOff, exec, quickshell --path $projectPath ipc call kbdBacklight toggle
bindlu = , XF86AudioPlay, exec, playerctl play-pause
bindlu = , XF86AudioPause, exec, playerctl play-pause
bindlu = , XF86AudioNext, exec, playerctl next
bindlu = , XF86AudioPrev, exec, playerctl previous
