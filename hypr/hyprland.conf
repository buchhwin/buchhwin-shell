# buchhwin-shell Phase 1 — Hyprland 0.56.x
# Start this file explicitly; it does not replace the user's hyprland.lua.

monitor = , preferred, auto, auto

$projectPath = $HOME/.local/share/buchhwin-shell
# Default apps from Settings > Default Apps (Kitty, Brave and Dolphin otherwise).
$terminal = $projectPath/scripts/launch-default.sh terminal
$browser = $projectPath/scripts/launch-default.sh browser
$fileManager = $projectPath/scripts/launch-default.sh files
$shellPath = $projectPath

# session-init.sh imports the environment and restarts the portal, then starts
# the shell through start-shell.sh (log in ~/.local/state/buchhwin-shell/).
# Nested test sessions replace this line with start-shell.sh.
exec-once = $projectPath/scripts/session-init.sh $shellPath

env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# The session name comes first so xdg-desktop-portal loads
# buchhwin-shell-portals.conf (KWallet secrets, KDE dialogs and settings).
env = XDG_CURRENT_DESKTOP,buchhwin-shell:Hyprland
# KDE applications keep the Plasma look (Breeze, colors, icons) in this session.
env = QT_QPA_PLATFORMTHEME,kde
env = XDG_SESSION_DESKTOP,buchhwin-shell
env = DESKTOP_SESSION,buchhwin-shell

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(4f8ff7cc)
    col.inactive_border = rgba(ffffff22)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000059)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true
        new_optimizations = true
        # Blur samples the wallpaper instead of the whole stack behind a
        # surface. The lock screen is the measurement that pointed here: it is
        # smooth because nothing is composited behind it, while the desktop -
        # same machine, same 16 % GPU - steps. With xray off, every frame in
        # which anything moves re-blurs whatever happens to be behind every
        # translucent surface, windows included; with it on, the thing behind
        # is always the same wallpaper.
        xray = true
    }
}

# The compositor moves in the same One UI rhythm as the shell (theme/
# Animations.qml): fast off the mark, long soft landing (buchhwinFast, the
# curve behind Easing.OutQuint), a hint of push for windows appearing
# (buchhwinSpring) and no looping border animation.
animations {
    enabled = true
    bezier = buchhwinFast, 0.22, 1.0, 0.36, 1.0
    bezier = buchhwinSpring, 0.2, 1.12, 0.32, 1.0
    animation = windows, 1, 2.0, buchhwinSpring, popin 87%
    animation = windowsOut, 1, 1.7, buchhwinFast, popin 87%
    animation = windowsMove, 1, 2.0, buchhwinFast
    animation = fade, 1, 1.7, buchhwinFast
    animation = layers, 1, 1.7, buchhwinFast, fade
    animation = workspaces, 1, 2.2, buchhwinFast, slidefade 10%
    animation = specialWorkspace, 1, 2.0, buchhwinFast, slidefadevert 15%
    animation = border, 1, 2.0, buchhwinFast
    animation = borderangle, 0, 1, buchhwinFast
}

# Frame scheduling. Hyprland's newer path decides when to start a frame from
# when the last one finished rather than from the vblank alone. It was turned
# on for an animation on an idle *laptop*: six panel animations left the GPU at
# 16 % busy on its lowest clock while the motion still stepped - nothing was
# short of power, frames were simply not being asked for often enough.
#
# It is off again, because it was never measured against more than one screen.
# On a three-monitor dock the same option decides when a frame starts for
# *which output*, and the symptom the user reported is exactly that shape: a
# video on the left monitor nearly freezes the moment focus moves to the second
# one, while its audio keeps playing. A monitor that stops being asked for
# frames looks like a frozen video and like a heavy machine, and this is the
# one thing in the session that changes who gets asked.
#
# If the laptop's own animations step again with one screen, this is the line
# to look at first - and then it belongs behind a condition, not on or off for
# both cases.
render {
    new_render_scheduling = false
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    # A restarted lock screen (scripts/session-action.sh) may take over a
    # session whose locker crashed.
    allow_session_lock_restore = true
    # XDG_CURRENT_DESKTOP is set on purpose (env above) so portals and default
    # apps recognise this session; skip Hyprland's "managed externally" notice.
    disable_xdg_env_checks = true
    # Shown until the shell paints the wallpaper; the theme's dark background
    # instead of pure black.
    background_color = rgb(0d0f14)
    # A tiled window dragged with SUPER + left button swaps into the slot under
    # the pointer. Without this it changes place between one frame and the next,
    # which reads as the window teleporting; with it, it travels there. In
    # exchange it trails the pointer slightly - that is what interpolating
    # toward the cursor means, and it is the trade.
    animate_mouse_windowdragging = true
    # The same for a window resized by dragging its border or SUPER + right.
    animate_manual_resizes = true
}

input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

source = ./keybinds.conf
source = ./windowrules.conf
