# Quickshell surfaces use their own transparent layer windows. Blur only goes
# behind pixels more opaque than ignore_alpha: panels (at least 40 % opaque,
# Settings > Appearance > Panels) keep their blur, scrims and shadows (theme/
# Colors.qml, at most 35 %) stay sharp. The session menu's stronger scrim needs
# the higher threshold; its card over that scrim stays above it.
layerrule = blur on, match:namespace ^(buchhwin-.*)$
layerrule = ignore_alpha 0.35, match:namespace ^(buchhwin-.*)$
layerrule = ignore_alpha 0.5, match:namespace ^(buchhwin-powerMenu)$
# Surfaces that can never show what is behind them, or that are mostly empty:
# the wallpaper covers the screen, the notch is opaque black, and the screen
# corners are four small shapes on a surface the size of the whole display.
# Blurring behind them buys nothing and costs a two-pass blur of their area on
# every frame.
#
# **The rule above is a catch-all, so every full-screen layer this shell adds
# lands in it by default and has to be taken out again by hand.** That is how
# `buchhwin-screencorners` came to blur the entire screen on every monitor,
# every frame, behind four rounded corners. If a new layer covers a lot of
# screen and shows little, put it here - and put it in `hyprland.lua` too:
# the corners rule was written into the Lua dialect only and sat missing from
# this file for a round, which `checks.py hypr` could not see because it never
# read layer rules. It does now.
layerrule = blur off, match:namespace ^(buchhwin-wallpaper)$
layerrule = blur off, match:namespace ^(buchhwin-notch)$
layerrule = blur off, match:namespace ^(buchhwin-screencorners)$
# The scrim is a flat wash under a panel that blurs for itself, and it is
# mapped for the whole session now (shell/components/ScrimLayer.qml), so at
# opacity 0 it would otherwise be a full-screen blur of nothing.
layerrule = blur off, match:namespace ^(buchhwin-scrim)$
# Surfaces that animate themselves: every ShellPanel and PopupPanel (the card
# fades and morphs, and the surface stays mapped until that close has
# finished - `closeTimer` in shell/components/ShellPanel.qml), the switcher
# and the OSD, which unmap the same way. The compositor's `layers` fade on top
# of that multiplied the card's own fade for the first frames of every open,
# and after every close faded an already empty screen-sized buffer out for
# another hundred milliseconds. Not here: the notification popups, which rely
# on the compositor's fade-out, and the colour picker, whose namespace is
# shared with the full-screen picking overlay that does not animate itself.
# One regex without a comma: `checks.py hypr` splits a layerrule at its first
# comma. Keep it the same as in hyprland.lua.
layerrule = no_anim on, match:namespace ^(buchhwin-(batteryPopup|bluetoothPopup|clipboard|controlCenter|dashboard|driveUnlock|emoji|eventEditor|eventsPopup|launcher|mediaPopup|networkPopup|notifications|overview|pairing|powerMenu|privacyPopup|profilePopup|settings|shortcutSheet|systemPopup|volumePopup|vpnPopup|wallpaperPicker|weatherPopup|welcome|wifiPassword|switcher|osd))$

# Kitty supplies opacity. Hyprland's global decoration settings provide blur
# behind transparent client surfaces and shadows around regular windows.

# Citrix opens its own dialogs ("disconnect / log off", class Wfica, title
# exactly "wfica") on a workspace of its choosing: on 14.10. on 1 while the
# session sat on 2, which looked like a hung session. Floating, centred and
# pinned, the dialog shows on whatever workspace its monitor has in view, also
# over a full-screen session. The session window carries its desktop's name as
# its title and is not matched. Keep it the same as in hyprland.lua.
windowrule {
    name = citrix-dialogs
    match:class = ^(Wfica)$
    match:title = ^(wfica)$
    float = on
    center = on
    pin = on
}

# Helper windows that must keep running but never show (list shared with the
# shell in services/hypr/HiddenWindows.js). xwaylandvideobridge (KDE autostart)
# otherwise opens a black, uncloseable window on workspace 1.
windowrule {
    name = buchhwin-hidden-windows
    match:class = ^(xwaylandvideobridge)$
    workspace = special:buchhwin-hidden silent
    float = on
    size = 1 1
    max_size = 1 1
    opacity = 0.0 override
    no_focus = on
    no_initial_focus = on
    no_anim = on
    no_blur = on
    no_shadow = on
}
