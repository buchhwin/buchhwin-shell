[General]
# Wallpaper behind the login screen: a path relative to this directory or an
# absolute path readable by the sddm user. install/system-install.sh copies the
# chosen wallpaper here and sets it in theme.conf.user. Empty: the bundled
# neutral gradient.
background=
# Blur the wallpaper like the lock screen does.
blur=true
# Avatar colour behind the initial and confirming power buttons.
accent="#4f8ff7"
font=Inter Variable
# Qt date format above the clock; quoted because of the comma.
dateFormat="dddd, d MMMM"
# Only for sddm-greeter-qt6 --test-mode: "fail" or "success" simulates the
# answer to a login. Leave empty.
previewLogin=
