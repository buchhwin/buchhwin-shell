# Portal routing for the buchhwin-shell session (XDG_CURRENT_DESKTOP starts
# with buchhwin-shell). Hyprland provides capture and shortcuts; KDE provides
# dialogs and appearance settings; KWallet provides secrets exactly like in
# Plasma, so Brave/Chromium read the same portal key and keep cookies and sync.
[preferred]
default=hyprland;kde;gtk
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Settings=kde;gtk
org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.AppChooser=kde
org.freedesktop.impl.portal.OpenURI=kde
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.InputCapture=hyprland
org.freedesktop.impl.portal.Notification=gtk
