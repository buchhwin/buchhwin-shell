# Keeps an XDG autostart entry out of buchhwin-shell and nowhere else.
# install/install.sh links this file as
#   ~/.config/systemd/user/app-<entry>@autostart.service.d/buchhwin-shell.conf
# for each entry scripts/lib/autostart-skip.sh names. systemd's xdg-autostart
# generator makes those units from /etc/xdg/autostart, and this adds the
# condition the generator itself writes for NotShowIn=: the entry is skipped
# while XDG_CURRENT_DESKTOP names buchhwin-shell, and runs as before in Plasma
# or any other session. It replaces masking the units at every login, which
# made the user manager reload before the autostart apps could start (306 ms
# on 19.10.) and once more at logout to unmask them; scripts/session-init.sh
# still masks an entry that has no drop-in yet.
[Service]
ExecCondition=/usr/lib/systemd/systemd-xdg-autostart-condition "" "buchhwin-shell"
