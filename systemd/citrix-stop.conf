# Citrix Workspace's scope, as scripts/launch-app.sh names it
# (app-buchhwin-citrix\x2dworkspace-<pid>.scope; its daemons and the desktop
# run in it). install/install.sh links this file as
#   ~/.config/systemd/user/app-buchhwin-citrix\x2dworkspace-.scope.d/buchhwin-shell.conf
# and systemd applies a drop-in named after everything up to a dash to every
# unit whose name begins so, transient scopes included. At a shutdown the
# scope did not end on SIGTERM - in both shutdowns with a log (21.10., 27.10.)
# it was the one user unit never stopped - and the user manager stood at
# "A stop job is running for User Manager for UID 1000 (…/2min)" until the
# user reset the machine. Five seconds, then SIGKILL. The pid locks the killed
# daemons leave behind are moved aside at the next login
# (scripts/citrix-locks.py).
[Scope]
TimeoutStopSec=5s
