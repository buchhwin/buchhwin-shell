# buchhwin-shell Kitty appearance. The session starts Kitty with this file via
# scripts/launch-kitty.sh; it can also be included from another kitty.conf.
include ../terminal/colors-dark.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0
# Nerd Font glyphs (prompt, Fastfetch) come from an installed Nerd Font.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD FiraCode Nerd Font Mono

background_opacity 0.8
dynamic_background_opacity yes
window_padding_width 10
hide_window_decorations yes
cursor_shape beam
# Alacritty's cursor: hollow when the window is not focused, blinking at
# 500 ms and never giving up (blink_timeout = 0).
cursor_shape_unfocused hollow
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
scrollback_lines 10000
wheel_scroll_multiplier 3.0
copy_on_select clipboard
# Hide the pointer as soon as a key is pressed (hide_when_typing).
mouse_hide_wait -1
enable_audio_bell no
confirm_os_window_close 0
