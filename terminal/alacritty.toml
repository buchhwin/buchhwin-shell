# Alacritty for Plasma, installed by install/plasma-terminal.sh.
[general]
live_config_reload = true

[terminal.shell]
program = "zsh"
args = ["-l"]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.8
blur = true

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11.0
builtin_box_drawing = true

[colors.primary]
background = "#0d0f14"
foreground = "#eceef2"

[colors.cursor]
text = "#0d0f14"
cursor = "#4f8ff7"

[colors.selection]
text = "#ffffff"
background = "#2a3b5c"

[colors.normal]
black = "#1a1d25"
red = "#f07178"
green = "#8bd49c"
yellow = "#f2c38a"
blue = "#6ea8fe"
magenta = "#a28bfe"
cyan = "#7fd4f7"
white = "#c9ced8"

[colors.bright]
black = "#4b5263"
red = "#f59fa3"
green = "#a8e2b7"
yellow = "#f7d7ab"
blue = "#92bdff"
magenta = "#bfb0ff"
cyan = "#a3e3fb"
white = "#ffffff"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
