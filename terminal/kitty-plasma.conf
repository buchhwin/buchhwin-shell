# Kitty for Plasma, installed by install/plasma-terminal.sh.
# Same look as the buchhwin sessions; KWin blurs the translucent background.
include buchhwin-colors.conf

font_family      JetBrains Mono
font_size        11.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD FiraCode Nerd Font Mono

shell zsh
background_opacity 0.86
background_blur 32
dynamic_background_opacity yes
window_padding_width 12
hide_window_decorations no
cursor_shape beam
cursor_blink_interval 0.6
scrollback_lines 100000
wheel_scroll_multiplier 3.0
copy_on_select clipboard
enable_audio_bell no
confirm_os_window_close 0
